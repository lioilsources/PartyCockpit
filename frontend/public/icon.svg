<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#34124f"/>
      <stop offset="0.6" stop-color="#160a26"/>
      <stop offset="1" stop-color="#0b0613"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d8b"/>
      <stop offset="0.5" stop-color="#ffd84d"/>
      <stop offset="1" stop-color="#3de8ff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1442"/>
      <stop offset="1" stop-color="#140a22"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="tv"><rect x="84" y="112" width="344" height="226" rx="30"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- stage glow behind the screen -->
  <ellipse cx="256" cy="230" rx="190" ry="120" fill="#ff3d8b" opacity="0.18" filter="url(#soft)"/>

  <!-- the TV: equaliser bars on the beat -->
  <rect x="84" y="112" width="344" height="226" rx="30" fill="url(#screen)"/>
  <g clip-path="url(#tv)" filter="url(#glow)">
    <rect x="118" y="238" width="30" height="80" rx="9" fill="#ff3d8b"/>
    <rect x="164" y="188" width="30" height="130" rx="9" fill="#ff6a6a"/>
    <rect x="210" y="150" width="30" height="168" rx="9" fill="#ffb24d"/>
    <rect x="256" y="200" width="30" height="118" rx="9" fill="#ffd84d"/>
    <rect x="302" y="166" width="30" height="152" rx="9" fill="#8fe8a6"/>
    <rect x="348" y="222" width="30" height="96" rx="9" fill="#3de8ff"/>
  </g>
  <rect x="84" y="112" width="344" height="226" rx="30" fill="none" stroke="#f4eefc" stroke-width="12"/>
  <!-- stand -->
  <path d="M226 338 L286 338 L300 372 L212 372 Z" fill="#f4eefc" opacity="0.9"/>
  <rect x="176" y="368" width="160" height="14" rx="7" fill="#f4eefc" opacity="0.9"/>

  <!-- a guest's phone in front, sending a sparkle to the screen -->
  <g transform="rotate(-14 366 360)">
    <rect x="318" y="284" width="104" height="170" rx="22" fill="#ffd84d"/>
    <rect x="332" y="304" width="76" height="118" rx="10" fill="#1a1000"/>
    <!-- QR-ish dots on the phone -->
    <g fill="#ffd84d">
      <rect x="342" y="314" width="20" height="20" rx="3"/>
      <rect x="378" y="314" width="20" height="20" rx="3"/>
      <rect x="342" y="350" width="20" height="20" rx="3"/>
      <rect x="374" y="352" width="8" height="8"/>
      <rect x="388" y="352" width="8" height="8"/>
      <rect x="374" y="366" width="8" height="8"/>
      <rect x="388" y="380" width="8" height="8"/>
      <rect x="346" y="388" width="8" height="8"/>
      <rect x="360" y="400" width="8" height="8"/>
      <rect x="376" y="396" width="8" height="8"/>
    </g>
    <rect x="356" y="432" width="28" height="7" rx="3.5" fill="#1a1000"/>
  </g>

  <!-- sparkle -->
  <g filter="url(#glow)">
    <path d="M136 410 Q142 438 168 444 Q142 450 136 478 Q130 450 104 444 Q130 438 136 410 Z" fill="#3de8ff"/>
    <path d="M196 404 Q199 416 210 419 Q199 422 196 434 Q193 422 182 419 Q193 416 196 404 Z" fill="#ff3d8b"/>
  </g>
</svg>
