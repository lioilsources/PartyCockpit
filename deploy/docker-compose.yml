# On-site (LAN) deployment: the party box (Mac Mini / mini PC / JODA when the party
# is at home) publishes 8098 on the LAN; guests' phones and the stage browser
# connect directly (DECISIONS.md D2). No tunnel needed for the party itself.
#
#   cp .env.example .env   # fill in
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
services:
  partycockpit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      PC_ADDR: ":8098"
      PC_DATA_DIR: /data
    ports:
      - "${PC_PORT:-8098}:8098"
    volumes:
      - ${PC_DATA_HOST:-./data}:/data
    mem_limit: 256m
